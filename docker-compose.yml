version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: climax_user
      POSTGRES_PASSWORD: climax_pass
      POSTGRES_DB: climax_keys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: climax_user
      POSTGRES_PASSWORD: climax_pass
      POSTGRES_DB: climax_keys
      POSTGRES_HOST: db
      PORT: 8080
    depends_on:
      - db

volumes:
  pgdata:
